<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Material Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  <style>
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .card-hover {
      transition: transform 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-5px);
    }
    .nav-link {
      position: relative;
      transition: color 0.3s ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -2px;
      left: 0;
      background-color: #fff;
      transition: width 0.3s ease;
    }
    .nav-link:hover::after {
      width: 100%;
    }
    #fileList {
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>
<body class="gradient-bg min-h-screen text-white">
  <div class="container mx-auto px-4 py-8">
    <header class="text-center py-12 animate__animated animate__fadeIn">
      <h1 class="text-5xl font-bold mb-6 bg-clip-text text-transparent bg-gradient-to-r from-yellow-300 to-yellow-100">
        Welcome to Study Material Portal
      </h1>
      <p class="text-xl text-gray-200 mb-8">Your one-stop solution for educational resources</p>
      <nav class="flex justify-center space-x-8">
        <a href="materials.html" class="nav-link text-xl px-6 py-2 rounded-full bg-white bg-opacity-10 hover:bg-opacity-20">
          Study Materials
        </a>
        <a href="contact.html" class="nav-link text-xl px-6 py-2 rounded-full bg-white bg-opacity-10 hover:bg-opacity-20">
          Contact Us
        </a>
      </nav>
    </header>

    <main class="mt-16 max-w-4xl mx-auto">
      <!-- File Upload Section -->
      <div class="card-hover bg-white bg-opacity-10 p-8 rounded-xl backdrop-blur-lg mb-8">
        <h2 class="text-2xl font-bold mb-4">Upload Study Materials</h2>
        <div class="space-y-4">
          <div class="flex items-center justify-center w-full">
            <label for="fileUpload" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer bg-white bg-opacity-5 hover:bg-opacity-10">
              <div class="flex flex-col items-center justify-center pt-5 pb-6">
                <svg class="w-8 h-8 mb-4 text-gray-200" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                </svg>
                <p class="mb-2 text-sm text-gray-200"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                <p class="text-xs text-gray-300">PDF, DOC, DOCX, PPT, or PPTX (MAX. 10MB)</p>
              </div>
              <input id="fileUpload" type="file" class="hidden" accept=".pdf,.doc,.docx,.ppt,.pptx" />
            </label>
          </div>
          <div id="uploadStatus" class="text-center text-sm"></div>
        </div>
      </div>

      <!-- File List Section -->
      <div class="card-hover bg-white bg-opacity-10 p-8 rounded-xl backdrop-blur-lg">
        <h2 class="text-2xl font-bold mb-4">Available Study Materials</h2>
        <div id="fileList" class="space-y-4">
          <!-- Files will be listed here -->
        </div>
      </div>
    </main>

    <footer class="text-center mt-20 text-sm text-gray-300">
      <p class="mb-2">&copy; 2025 Rohit Majage</p>
      <p class="text-yellow-300">Email: rohitmajage1@gmail.com</p>
    </footer>
  </div>

  <script>
    // File handling functions
    const fileUpload = document.getElementById('fileUpload');
    const uploadStatus = document.getElementById('uploadStatus');
    const fileList = document.getElementById('fileList');
    const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB

    // Load files from localStorage on page load
    window.addEventListener('load', () => {
      loadFiles();
    });

    // Handle file upload
    fileUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (file.size > MAX_FILE_SIZE) {
        uploadStatus.innerHTML = '<p class="text-red-400">File is too large. Maximum size is 10MB.</p>';
        return;
      }

      const allowedTypes = ['.pdf', '.doc', '.docx', '.ppt', '.pptx'];
      const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
      
      if (!allowedTypes.includes(fileExtension)) {
        uploadStatus.innerHTML = '<p class="text-red-400">Invalid file type. Please upload PDF, DOC, DOCX, PPT, or PPTX files.</p>';
        return;
      }

      // Save file to localStorage
      const reader = new FileReader();
      reader.onload = (e) => {
        const files = JSON.parse(localStorage.getItem('studyFiles') || '[]');
        files.push({
          name: file.name,
          type: file.type,
          size: file.size,
          data: e.target.result,
          uploadDate: new Date().toISOString()
        });
        localStorage.setItem('studyFiles', JSON.stringify(files));
        uploadStatus.innerHTML = '<p class="text-green-400">File uploaded successfully!</p>';
        loadFiles();
      };
      reader.readAsDataURL(file);
    });

    // Load and display files
    function loadFiles() {
      const files = JSON.parse(localStorage.getItem('studyFiles') || '[]');
      fileList.innerHTML = files.map((file, index) => `
        <div class="flex items-center justify-between p-4 bg-white bg-opacity-5 rounded-lg">
          <div>
            <h3 class="font-semibold">${file.name}</h3>
            <p class="text-sm text-gray-300">${formatFileSize(file.size)}</p>
          </div>
          <div class="flex space-x-2">
            <button onclick="downloadFile(${index})" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 rounded-lg text-sm">
              Download
            </button>
            <button onclick="deleteFile(${index})" class="px-4 py-2 bg-red-500 hover:bg-red-600 rounded-lg text-sm">
              Delete
            </button>
          </div>
        </div>
      `).join('') || '<p class="text-center text-gray-300">No files uploaded yet.</p>';
    }

    // Download file
    function downloadFile(index) {
      const files = JSON.parse(localStorage.getItem('studyFiles') || '[]');
      const file = files[index];
      const link = document.createElement('a');
      link.href = file.data;
      link.download = file.name;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Delete file
    function deleteFile(index) {
      const files = JSON.parse(localStorage.getItem('studyFiles') || '[]');
      files.splice(index, 1);
      localStorage.setItem('studyFiles', JSON.stringify(files));
      loadFiles();
    }

    // Format file size
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
  </script>
</body>
</html>
