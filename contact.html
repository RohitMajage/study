                </div>
            </div>
        </main>

        <footer class="text-center mt-20 text-sm text-gray-300">
            <p class="mb-2">&copy; 2025 Rohit Majage</p>
            <p class="text-yellow-300">Email: rohitmajage1@gmail.com</p>
