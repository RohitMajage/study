<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Materials</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            min-height: 100vh;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .file-item {
            transition: all 0.3s ease;
        }
        .file-item:hover {
            transform: translateX(5px);
        }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <!-- User Input Section -->
        <div id="userInputSection" class="card rounded-lg shadow-lg p-8 mb-8 animate__animated animate__fadeIn">
            <h2 class="text-2xl font-bold mb-4">Enter Your Details</h2>
            <form id="userForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                        <input type="text" id="firstName" required
                               class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                        <input type="text" id="lastName" required
                               class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                </div>
                <button type="submit" 
                        class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition-colors">
                    Continue
                </button>
            </form>
        </div>

        <!-- File List Section -->
        <div id="fileListSection" class="hidden">
            <div class="card rounded-lg shadow-lg p-8 animate__animated animate__fadeIn">
                <h2 class="text-2xl font-bold mb-4">Available Study Materials</h2>
                <div id="fileList" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = '';

        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            
            if (firstName && lastName) {
                currentUser = `${firstName} ${lastName}`;
                document.getElementById('userInputSection').classList.add('hidden');
                document.getElementById('fileListSection').classList.remove('hidden');
                fetchFiles();
            }
        });

        async function fetchFiles() {
            try {
                const response = await fetch('/uploads/');
                const files = await response.json();
                const fileList = document.getElementById('fileList');
                
                if (files.length === 0) {
                    fileList.innerHTML = '<p class="text-gray-500 text-center py-4">No files available for download.</p>';
                    return;
                }

                fileList.innerHTML = files.map(file => `
                    <div class="file-item flex items-center justify-between p-3 bg-white rounded shadow-sm">
                        <div class="flex items-center space-x-3">
                            <svg class="h-6 w-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                      d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
                            </svg>
                            <span class="text-gray-800">${file}</span>
                        </div>
                        <a href="/uploads/${file}?user=${encodeURIComponent(currentUser)}" 
                           class="text-green-600 hover:text-green-800 font-medium"
                           target="_blank">
                            Download
                        </a>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error fetching files:', error);
                document.getElementById('fileList').innerHTML = 
                    '<p class="text-red-500 text-center py-4">Error loading files. Please try again.</p>';
            }
        }
    </script>
</body>
</html>
