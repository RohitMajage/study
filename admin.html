<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <style>
    body {
      background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
      min-height: 100vh;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .file-item {
      transition: all 0.3s ease;
    }
    .file-item:hover {
      transform: translateX(5px);
    }
  </style>
</head>
<body class="p-8">
  <div class="max-w-4xl mx-auto">
    <!-- Login Section -->
    <div id="loginSection" class="card rounded-lg shadow-lg p-8 mb-8 animate__animated animate__fadeIn">
      <h2 class="text-2xl font-bold mb-4">Admin Login</h2>
      <div class="mb-4">
        <input type="password" id="password" placeholder="Enter password" 
               class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>
      <button onclick="login()" 
              class="w-full bg-red-600 text-white py-2 rounded hover:bg-red-700 transition-colors">
        Login
      </button>
    </div>

    <!-- Admin Panel Section -->
    <div id="adminSection" class="hidden">
      <!-- Upload Section -->
      <div class="card rounded-lg shadow-lg p-8 mb-8 animate__animated animate__fadeIn">
        <h2 class="text-2xl font-bold mb-4">Upload Study Material</h2>
        <form id="uploadForm" class="space-y-4">
          <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
            <input type="file" id="fileInput" class="hidden" accept=".pdf,.doc,.docx,.ppt,.pptx">
            <label for="fileInput" class="cursor-pointer">
              <div class="text-gray-600">
                <svg class="mx-auto h-12 w-12 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                        d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                </svg>
                <p class="text-sm">Click to select a file or drag and drop</p>
                <p class="text-xs text-gray-500 mt-1">PDF, DOC, DOCX, PPT, PPTX</p>
              </div>
            </label>
          </div>
          <button type="submit" 
                  class="w-full bg-red-600 text-white py-2 rounded hover:bg-red-700 transition-colors">
            Upload File
          </button>
        </form>
      </div>

      <!-- File List Section -->
      <div class="card rounded-lg shadow-lg p-8 mb-8 animate__animated animate__fadeIn">
        <h2 class="text-2xl font-bold mb-4">Uploaded Files</h2>
        <div id="fileList" class="space-y-2"></div>
      </div>

      <!-- Download Logs Section -->
      <div class="card rounded-lg shadow-lg p-8 animate__animated animate__fadeIn">
        <h2 class="text-2xl font-bold mb-4">Download Logs</h2>
        <div id="logList" class="space-y-2"></div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = '2KD22AD036';
    let logInterval;

    function login() {
      const password = document.getElementById('password').value;
      if (password === ADMIN_PASSWORD) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminSection').classList.remove('hidden');
        fetchUploadedFiles();
        fetchDownloadLogs();
        // Refresh logs every 30 seconds
        logInterval = setInterval(fetchDownloadLogs, 30000);
      } else {
        alert('Invalid password');
        document.getElementById('password').value = ''; // Clear the password field
      }
    }

    // Add enter key support for login
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        login();
      }
    });

    async function fetchUploadedFiles() {
      try {
        const response = await fetch('/uploads/');
        const files = await response.json();
        const fileList = document.getElementById('fileList');
        fileList.innerHTML = files.map(file => `
          <div class="file-item flex items-center justify-between p-3 bg-white rounded shadow-sm">
            <span class="text-gray-800">${file}</span>
            <div class="space-x-2">
              <a href="/uploads/${file}" target="_blank" 
                 class="text-blue-600 hover:text-blue-800">View</a>
              <button onclick="deleteFile('${file}')" 
                      class="text-red-600 hover:text-red-800">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error fetching files:', error);
      }
    }

    async function fetchDownloadLogs() {
      try {
        const response = await fetch('/logs');
        const logs = await response.json();
        const logList = document.getElementById('logList');
        logList.innerHTML = logs.reverse().map(log => `
          <div class="p-3 bg-white rounded shadow-sm">
            <div class="text-sm text-gray-600">
              <span class="font-semibold">${log.user}</span> downloaded 
              <span class="font-semibold">${log.file}</span>
            </div>
            <div class="text-xs text-gray-500">${log.timestamp}</div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error fetching logs:', error);
      }
    }

    async function deleteFile(filename) {
      if (confirm('Are you sure you want to delete this file?')) {
        try {
          const response = await fetch(`/uploads/${filename}`, {
            method: 'DELETE'
          });
          const data = await response.json();
          if (response.ok) {
            alert('File deleted successfully');
            fetchUploadedFiles();
          } else {
            alert(data.error || 'Failed to delete file');
          }
        } catch (error) {
          alert('Error deleting file: ' + error.message);
        }
      }
    }

    async function uploadFile(event) {
      event.preventDefault();
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      
      if (!file) {
        alert('Please select a file to upload');
        return;
      }

      // Check file type
      const allowedTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'application/vnd.ms-powerpoint', 'application/vnd.openxmlformats-officedocument.presentationml.presentation'];
      if (!allowedTypes.includes(file.type)) {
        alert('Please upload only PDF, DOC, DOCX, PPT, or PPTX files');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('/upload', {
          method: 'POST',
          body: formData
        });
        
        const data = await response.json();
        if (response.ok) {
          alert('File uploaded successfully');
          fileInput.value = ''; // Clear the file input
          fetchUploadedFiles(); // Refresh the file list
        } else {
          alert(data.error || 'Failed to upload file');
        }
      } catch (error) {
        alert('Error uploading file: ' + error.message);
      }
    }

    // Add event listener for file upload form
    document.getElementById('uploadForm').addEventListener('submit', uploadFile);

    // Add drag and drop functionality
    const dropZone = document.querySelector('.border-dashed');
    
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, unhighlight, false);
    });

    function highlight(e) {
      dropZone.classList.add('border-red-500');
    }

    function unhighlight(e) {
      dropZone.classList.remove('border-red-500');
    }

    dropZone.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
      const dt = e.dataTransfer;
      const files = dt.files;
      document.getElementById('fileInput').files = files;
    }
  </script>
</body>
</html>
